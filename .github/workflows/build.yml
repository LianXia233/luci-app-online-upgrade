name: Build Package

permissions:
  contents: write

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # ---------- 0. Guard: one version everywhere ----------
  # app.js/style.css are cache-busted with ?v=<version>; if that drifts from
  # PKG_VERSION the browser keeps executing the previous script after an
  # upgrade, so the mismatch must fail CI instead of shipping silently.
  verify:
    runs-on: ubuntu-latest
    # Single source of truth: every later job (tag, release title, package
    # filename check, release notes) consumes these outputs, so the published
    # Release can never drift from the version baked into the .apk.
    outputs:
      version: ${{ steps.ver.outputs.version }}
      pkg_release: ${{ steps.ver.outputs.pkg_release }}
      tag: ${{ steps.ver.outputs.tag }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Version consistency (Makefile / Cargo.toml / templates)
        id: ver
        run: |
          set -eu
          pkg_ver=$(sed -n 's/^PKG_VERSION:=//p' Makefile)
          pkg_rel=$(sed -n 's/^PKG_RELEASE:=//p' Makefile)
          cargo_ver=$(sed -n 's/^version = "\(.*\)"$/\1/p' rust/Cargo.toml)
          tpl="root/usr/share/ucode/luci/template/online-upgrade/main.ut"
          js_ver=$(grep -o 'app\.js?v=[0-9A-Za-z._-]*' "$tpl" | head -1 | sed 's/.*v=/v/')
          css_ver=$(grep -o 'style.css?v=[0-9A-Za-z._-]*' "$tpl" | head -1 | sed 's/.*v=/v/')
          echo "PKG_VERSION=$pkg_ver PKG_RELEASE=$pkg_rel Cargo=$cargo_ver app.js=$js_ver style.css=$css_ver"
          fail=0
          [ -n "$pkg_ver" ] || { echo "PKG_VERSION 为空" >&2; fail=1; }
          case "$pkg_rel" in ''|*[!0-9]*) echo "PKG_RELEASE 非法或为空: '$pkg_rel'" >&2; fail=1 ;; esac
          [ "$pkg_ver" = "$cargo_ver" ] || { echo "rust/Cargo.toml 版本与 PKG_VERSION 不一致" >&2; fail=1; }
          [ "v$pkg_ver" = "$js_ver" ] || { echo "main.ut 中 app.js?v= 与 PKG_VERSION 不一致" >&2; fail=1; }
          [ "v$pkg_ver" = "$css_ver" ] || { echo "main.ut 中 style.css?v= 与 PKG_VERSION 不一致" >&2; fail=1; }
          [ "$fail" -eq 0 ] || exit 1
          echo "version=$pkg_ver" >> "$GITHUB_OUTPUT"
          echo "pkg_release=$pkg_rel" >> "$GITHUB_OUTPUT"
          echo "tag=v$pkg_ver" >> "$GITHUB_OUTPUT"

  # ---------- 1. Rust backend: cross-compile both targets ----------
  rust:
    runs-on: ubuntu-latest
    needs: verify
    strategy:
      matrix:
        include:
          - target: aarch64-unknown-linux-musl
            cc: gcc-aarch64-linux-gnu
            cc_env: CC_aarch64_unknown_linux_musl=aarch64-linux-gnu-gcc
          - target: x86_64-unknown-linux-musl
            cc: musl-tools
            cc_env: CC_x86_64_unknown_linux_musl=musl-gcc
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install cross C toolchain (required by ring/rustls)
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.cc }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build (static musl, rust-lld self-contained)
        working-directory: rust
        env:
          RUSTFLAGS: "-C link-self-contained=yes -C linker=rust-lld"
        run: |
          # ring's build script reads the CC_* env when compiling its C sources
          env ${{ matrix.cc_env }} cargo build --release --locked --target ${{ matrix.target }}
          file target/${{ matrix.target }}/release/online-upgrade

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: online-upgrade-${{ matrix.target }}
          path: rust/target/${{ matrix.target }}/release/online-upgrade

  # ---------- 2. Package with ImmortalWrt SDKs ----------
  package:
    runs-on: ubuntu-latest
    needs: rust
    strategy:
      matrix:
        include:
          - sdk_url: https://downloads.immortalwrt.org/releases/25.12.0/targets/mediatek/filogic/immortalwrt-sdk-25.12.0-mediatek-filogic_gcc-14.3.0_musl.Linux-x86_64.tar.zst
            bin_artifact: online-upgrade-aarch64-unknown-linux-musl
            pkg_arch: aarch64_cortex-a53
            ext: apk
          - sdk_url: https://downloads.immortalwrt.org/releases/25.12.0/targets/x86/64/immortalwrt-sdk-25.12.0-x86-64_gcc-14.3.0_musl.Linux-x86_64.tar.zst
            bin_artifact: online-upgrade-x86_64-unknown-linux-musl
            pkg_arch: x86_64
            ext: apk
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          path: package-dir

      - name: Download SDK
        run: |
          curl -sL --retry 5 --retry-delay 10 "${{ matrix.sdk_url }}" -o sdk.tar
          mkdir sdk && tar --zstd -xf sdk.tar -C sdk --strip-components=1

      - name: Fetch Rust binary artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.bin_artifact }}
          path: bin

      - name: Place binary into package root
        run: |
          mkdir -p package-dir/root/usr/bin
          install -m 0755 bin/online-upgrade package-dir/root/usr/bin/online-upgrade
          file package-dir/root/usr/bin/online-upgrade

      - name: Install feeds
        working-directory: sdk
        run: |
          ./scripts/feeds update luci --depth 1
          ./scripts/feeds install -a
          make defconfig

      - name: Build package
        working-directory: sdk
        run: |
          mkdir -p package/luci-app-online-upgrade
          cp -r ../package-dir/* package/luci-app-online-upgrade/
          make -j$(nproc) package/luci-app-online-upgrade/compile V=s

      - name: Collect artifacts
        run: |
          mkdir -p /tmp/pkgs
          # NB: the 25.12 SDK drops everything into bin/packages/base/, so the
          # arch must come from the matrix, not the directory name — otherwise
          # both apks are identically named and the release upload overwrites one
          find sdk/bin/packages -name "luci-app-online-upgrade*.${{ matrix.ext }}" | while read f; do
            cp "$f" "/tmp/pkgs/$(basename "$f" ".${{ matrix.ext }}")_${{ matrix.pkg_arch }}.${{ matrix.ext }}"
          done
          ls -lh /tmp/pkgs/

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.bin_artifact }}
          path: /tmp/pkgs/*

  # ---------- 3. Release ----------
  release:
    runs-on: ubuntu-latest
    # verify supplies the version; package supplies the .apk files. Both the
    # tag and the release title come from PKG_VERSION, never from run_number.
    needs: [verify, package]
    steps:
      - name: Checkout source (CHANGELOG drives the release notes)
        uses: actions/checkout@v4
        with:
          path: src

      - name: Download all package artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: pkg-*
          merge-multiple: true
          path: /tmp/pkgs

      - name: Verify package filenames match PKG_VERSION / PKG_RELEASE
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          RELEASE: ${{ needs.verify.outputs.pkg_release }}
        run: |
          set -eu
          ls -lh /tmp/pkgs/
          prefix="luci-app-online-upgrade-${VERSION}-r${RELEASE}_"
          found=0
          for f in /tmp/pkgs/*; do
            [ -f "$f" ] || continue
            case "$(basename "$f")" in
              "$prefix"*) found=$((found + 1)) ;;
              *) echo "产物版本与 Makefile 不一致: $(basename "$f") (期望前缀 $prefix)" >&2; exit 1 ;;
            esac
          done
          [ "$found" -gt 0 ] || { echo "没有找到任何安装包产物" >&2; exit 1; }
          echo "版本校验通过: $found 个产物均为 ${VERSION}-r${RELEASE}"

      - name: Build release notes from CHANGELOG
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          RELEASE: ${{ needs.verify.outputs.pkg_release }}
          TAG: ${{ needs.verify.outputs.tag }}
        run: |
          set -eu
          python3 - <<'PY'
          import os
          import re

          version = os.environ["VERSION"]
          release = os.environ["RELEASE"]
          tag = os.environ["TAG"]
          with open("src/CHANGELOG.md", encoding="utf-8") as fh:
              text = fh.read()
          pattern = r"^## \[" + re.escape(version) + r"\][^\n]*\n(.*?)(?=^## \[|\Z)"
          match = re.search(pattern, text, re.M | re.S)
          section = match.group(1).strip() if match else "_CHANGELOG 中未找到该版本条目，请补充。_"
          header = (
              "## luci-app-online-upgrade " + tag + "\n\n"
              "发布标签与安装包版本统一由 `Makefile` 的 `PKG_VERSION=" + version
              + "` / `PKG_RELEASE=" + release + "` 派生；本 Release 的产物为 "
              "`luci-app-online-upgrade-" + version + "-r" + release
              + "_<arch>.apk`。\n\n"
              "适用 ImmortalWrt 25.12+ / OpenWrt 25+（apk 包管理器），提供 "
              "`aarch64_cortex-a53`（mediatek/filogic）与 `x86_64` 两个架构。\n\n"
              "---\n\n"
              "### 更新日志（同步自 CHANGELOG.md [" + version + "]）\n\n"
          )
          with open("/tmp/release-notes.md", "w", encoding="utf-8") as fh:
              fh.write(header + section + "\n")
          print(open("/tmp/release-notes.md", encoding="utf-8").read()[:500])
          PY

      - name: Drop stale assets on re-run
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.verify.outputs.tag }}
        run: |
          set -eu
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets \
              --jq '.assets[].name' > /tmp/old-assets.txt || true
            while IFS= read -r asset; do
              [ -n "$asset" ] || continue
              echo "删除旧产物: $asset"
              gh release delete-asset "$TAG" "$asset" --repo "$GITHUB_REPOSITORY" -y || true
            done < /tmp/old-assets.txt
          else
            echo "首次发布 $TAG，无需清理旧产物"
          fi

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.verify.outputs.tag }}
          name: v${{ needs.verify.outputs.version }}
          body_path: /tmp/release-notes.md
          files: /tmp/pkgs/*
          token: ${{ github.token }}
          make_latest: true
